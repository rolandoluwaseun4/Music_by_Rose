<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Pro</title>
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  :root {
    --primary: #fa233b;
    --primary-light: #fb5c74;
    --bg-dark: #000;
    --bg-light: #1a1a1a;
  }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, #1a1a1a 0%, #000 100%);
    color: #fff;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* Auth Screen */
  .auth-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #fa233b 0%, #fb5c74 50%, #1a1a1a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    transition: opacity 0.5s, visibility 0.5s;
  }

  .auth-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .auth-container {
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(20px);
    padding: 60px 50px;
    border-radius: 24px;
    text-align: center;
    max-width: 450px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    animation: slideUp 0.5s ease;
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .auth-container h1 {
    font-size: 42px;
    font-weight: 800;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #fff 0%, #fa233b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .auth-container p {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 40px;
  }

  .auth-buttons {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .auth-btn {
    padding: 16px 32px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .google-btn {
    background: white;
    color: #333;
  }

  .google-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
  }

  .email-btn {
    background: linear-gradient(135deg, #fa233b 0%, #fb5c74 100%);
    color: white;
  }

  .email-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(250, 35, 59, 0.4);
  }

  /* Header */
  header {
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #fa233b 0%, #fb5c74 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hamburger {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 4px;
  }

  .hamburger span {
    width: 25px;
    height: 3px;
    background: white;
    border-radius: 2px;
    transition: all 0.3s ease;
  }

  .hamburger.active span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }

  .hamburger.active span:nth-child(2) {
    opacity: 0;
  }

  .hamburger.active span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }

  nav {
    display: flex;
    gap: 8px;
  }

  nav button {
    background: none;
    border: none;
    font-size: 15px;
    padding: 8px 16px;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.6);
    transition: all 0.3s ease;
    border-radius: 8px;
    font-weight: 500;
  }

  nav button:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
  }

  nav button.active {
    color: #fff;
    background: rgba(255, 255, 255, 0.15);
  }

  .user-profile {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 24px;
    transition: background 0.3s;
    position: relative;
  }

  .user-profile:hover {
    background: rgba(255, 255, 255, 0.05);
  }

  .user-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #fa233b;
  }

  .user-name {
    font-size: 14px;
    font-weight: 600;
  }

  .user-dropdown {
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 8px;
    background: rgba(30, 30, 30, 0.95);
    backdrop-filter: blur(20px);
    border-radius: 12px;
    padding: 8px;
    min-width: 200px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: all 0.3s;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }

  .user-profile:hover .user-dropdown {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .dropdown-item {
    padding: 12px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .dropdown-item:hover {
    background: rgba(255, 255, 255, 0.05);
  }

  /* Container */
  .container {
    padding: 24px;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
    padding-bottom: 120px;
  }

  /* Hero Section */
  .hero {
    background: linear-gradient(135deg, #fa233b 0%, #fb5c74 100%);
    border-radius: 20px;
    padding: 60px 40px;
    margin-bottom: 40px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s;
  }

  .hero:hover {
    transform: scale(1.02);
  }

  .hero::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><rect fill="rgba(255,255,255,0.03)" width="50" height="50"/></svg>');
    opacity: 0.5;
  }

  .hero-content {
    position: relative;
    z-index: 1;
  }

  .hero h2 {
    margin: 0 0 12px 0;
    font-size: 48px;
    font-weight: 700;
  }

  .hero p {
    margin: 0 0 24px 0;
    font-size: 20px;
    opacity: 0.9;
  }

  .hero-tag {
    display: inline-block;
    background: rgba(255, 255, 255, 0.2);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Section Headers */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .section-header h2 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
  }

  .view-all {
    color: #fa233b;
    text-decoration: none;
    font-weight: 600;
    transition: opacity 0.3s;
  }

  .view-all:hover {
    opacity: 0.7;
  }

  /* Song Grid */
  .song-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 24px;
    margin-bottom: 48px;
  }

  .song-card {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 16px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .song-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(250, 35, 59, 0.1) 0%, rgba(251, 92, 116, 0.1) 100%);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .song-card:hover {
    transform: translateY(-8px);
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  }

  .song-card:hover::before {
    opacity: 1;
  }

  .song-card-image {
    position: relative;
    margin-bottom: 12px;
  }

  .song-card img {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 12px;
    object-fit: cover;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }

  .play-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 48px;
    height: 48px;
    background: rgba(250, 35, 59, 0.95);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .song-card:hover .play-overlay {
    opacity: 1;
  }

  .play-overlay::after {
    content: '▶';
    color: white;
    font-size: 18px;
    margin-left: 3px;
  }

  .like-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 32px;
    height: 32px;
    background: rgba(0, 0, 0, 0.5);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 2;
  }

  .song-card:hover .like-btn {
    opacity: 1;
  }

  .like-btn::before {
    content: '♡';
    font-size: 18px;
    color: white;
  }

  .like-btn.liked {
    background: rgba(250, 35, 59, 0.9);
    opacity: 1;
  }

  .like-btn.liked::before {
    content: '♥';
  }

  .song-card h3 {
    margin: 0 0 4px 0;
    font-size: 15px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    position: relative;
    z-index: 1;
  }

  .song-card p {
    margin: 0;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.6);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    position: relative;
    z-index: 1;
  }

  /* Mini Player Bar */
  .player-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(26, 26, 26, 0.95);
    backdrop-filter: blur(40px);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding: 12px 24px;
    z-index: 200;
    cursor: pointer;
    transition: all 0.3s ease;
    display: none;
  }

  .player-bar.active {
    display: block;
  }

  .player-bar:hover {
    background: rgba(26, 26, 26, 0.98);
  }

  .player-content {
    display: flex;
    align-items: center;
    gap: 16px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .mini-artwork {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .mini-info {
    flex: 1;
    min-width: 0;
  }

  .mini-info h4 {
    margin: 0 0 4px 0;
    font-size: 15px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mini-info p {
    margin: 0;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.6);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .player-controls {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .player-controls button {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    transition: all 0.2s;
    color: white;
    padding: 8px;
  }

  .player-controls button:hover {
    transform: scale(1.1);
  }

  .progress-container {
    width: 300px;
    height: 4px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #fa233b 0%, #fb5c74 100%);
    border-radius: 2px;
    transition: width 0.1s linear;
  }

  .time-display {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
    white-space: nowrap;
  }

  .volume-control {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .volume-control button {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: white;
  }

  .volume-slider {
    width: 100px;
    height: 4px;
    -webkit-appearance: none;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 2px;
    outline: none;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    background: white;
    border-radius: 50%;
    cursor: pointer;
  }

  /* FULLSCREEN NOW PLAYING VIEW */
  .now-playing-fullscreen {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(180deg, #1a1a1a 0%, #000 100%);
    z-index: 300;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .now-playing-fullscreen::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    right: -50%;
    bottom: -50%;
    background-size: cover;
    background-position: center;
    filter: blur(100px) saturate(1.5);
    opacity: 0.25;
    transform: scale(1.2);
    transition: all 0.8s ease;
    z-index: -1;
  }

  .now-playing-fullscreen.active::before {
    opacity: 0.35;
  }

  .now-playing-fullscreen.active {
    transform: translateY(0);
  }

  .fullscreen-header {
    padding: 20px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(20px);
    z-index: 10;
  }

  .fullscreen-header button {
    background: none;
    border: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .fullscreen-header button:hover {
    transform: scale(1.1);
  }

  .fullscreen-content {
    flex: 1;
    padding: 40px 24px;
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .fullscreen-artwork {
    width: 100%;
    max-width: 400px;
    aspect-ratio: 1;
    border-radius: 20px;
    object-fit: cover;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    margin-bottom: 40px;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .fullscreen-info {
    text-align: center;
    margin-bottom: 40px;
    width: 100%;
  }

  .fullscreen-info h2 {
    margin: 0 0 8px 0;
    font-size: 28px;
    font-weight: 700;
  }

  .fullscreen-info p {
    margin: 0 0 8px 0;
    font-size: 20px;
    color: rgba(255, 255, 255, 0.7);
  }

  .audio-quality {
    display: inline-block;
    padding: 4px 12px;
    background: rgba(250, 35, 59, 0.2);
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    color: #fa233b;
    margin-top: 8px;
  }

  .fullscreen-progress {
    width: 100%;
    margin-bottom: 40px;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 3px;
    cursor: pointer;
    margin-bottom: 12px;
    position: relative;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #fa233b 0%, #fb5c74 100%);
    border-radius: 3px;
    transition: width 0.1s linear;
    position: relative;
  }

  .progress-bar-fill::after {
    content: '';
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  }

  .progress-times {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.6);
  }

  .fullscreen-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
    margin-bottom: 40px;
  }

  .fullscreen-controls button {
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    transition: all 0.2s;
    padding: 12px;
  }

  .fullscreen-controls button:hover {
    transform: scale(1.1);
  }

  .control-btn-small {
    font-size: 28px;
    opacity: 0.7;
  }

  .control-btn-small:hover {
    opacity: 1;
  }

  .control-btn-main {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #fa233b 0%, #fb5c74 100%);
    border-radius: 50%;
    font-size: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 30px rgba(250, 35, 59, 0.4);
  }

  /* LYRICS SECTION */
  .lyrics-section {
    width: 100%;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    padding: 32px;
    margin-top: 20px;
    max-height: 500px;
    overflow-y: auto;
  }

  .lyrics-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .lyrics-header h3 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
  }

  .lyrics-toggle {
    background: rgba(250, 35, 59, 0.2);
    border: none;
    color: #fa233b;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.3s;
  }

  .lyrics-toggle:hover {
    background: rgba(250, 35, 59, 0.3);
  }

  .lyrics-content {
    line-height: 2;
    font-size: 16px;
    color: rgba(255, 255, 255, 0.8);
    white-space: pre-wrap;
  }

  .lyrics-loading {
    text-align: center;
    padding: 40px;
    color: rgba(255, 255, 255, 0.5);
  }

  /* Search Bar */
  .search-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .search-bar input {
    flex: 1;
    min-width: 200px;
    padding: 14px 20px;
    border-radius: 12px;
    border: none;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 16px;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
  }

  .search-bar input::placeholder {
    color: rgba(255, 255, 255, 0.5);
  }

  .search-bar input:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.15);
    box-shadow: 0 0 0 3px rgba(250, 35, 59, 0.3);
  }

  .search-bar button {
    padding: 14px 32px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #fa233b 0%, #fb5c74 100%);
    color: white;
    cursor: pointer;
    font-weight: 600;
    font-size: 16px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(250, 35, 59, 0.4);
  }

  .search-bar button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(250, 35, 59, 0.5);
  }

  /* Sections */
  .section {
    display: none;
  }

  .section.active {
    display: block;
  }

  .loading {
    text-align: center;
    padding: 60px 20px;
  }

  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255, 255, 255, 0.1);
    border-top-color: #fa233b;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: rgba(255, 255, 255, 0.5);
  }

  /* Mobile Responsive */
  @media (max-width: 768px) {
    header {
      padding: 12px 16px;
    }

    header h1 {
      font-size: 22px;
    }

    .hamburger {
      display: flex;
    }

    nav {
      position: fixed;
      top: 60px;
      left: -100%;
      width: 100%;
      background: rgba(0, 0, 0, 0.98);
      backdrop-filter: blur(20px);
      flex-direction: column;
      gap: 0;
      padding: 20px 0;
      transition: left 0.3s ease;
      z-index: 99;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    nav.active {
      left: 0;
    }

    nav button {
